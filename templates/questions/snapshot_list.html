
<style>
    .page-title {
        margin-bottom: 20px;
    }

    .snapshot-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 20px;
        background-color: #fafafa;
    }

    .snapshot-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .snapshot-date {
        font-size: 14px;
        color: #666;
    }

    .badge {
        background-color: #0d6efd;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
    }

    .json-box {
        background-color: #111;
        color: #f1f1f1;
        padding: 12px;
        border-radius: 6px;
        max-height: 300px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.6;
    }

    .empty-box {
        padding: 20px;
        border: 1px dashed #ccc;
        border-radius: 6px;
        background-color: #fdfdfd;
        text-align: center;
        color: #666;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #0d6efd;
        font-weight: 500;
    }
</style>

<a class="back-link" href="{% url 'exam_snapshot_create' exam.id %}">
    ← ساخت Snapshot جدید
</a>

<h2 class="page-title">
    Snapshotهای آزمون «{{ exam.name }}»
</h2>

{% for s in snapshots %}
    <div class="snapshot-card">
        <div class="snapshot-header">
            <div class="snapshot-date">
                📅 {{ s.created_at|date:"Y-m-d H:i" }}
            </div>
            <div class="badge">
                ID: {{ s.id }}
            </div>
        </div>

        <div class="json-box">
            <pre>{{ s.data|safe }}</pre>
        </div>
    </div>
{% empty %}
    <div class="empty-box">
        ❗ هنوز هیچ Snapshotی برای این آزمون ذخیره نشده است
    </div>
{% endfor %}
