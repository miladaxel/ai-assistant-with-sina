<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f6f7f9;
            padding: 40px;
        }

        .chat-box {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        h2 {
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .answer {
            margin-top: 20px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .error {
            margin-top: 16px;
            color: #b91c1c;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>سوالتو بپرس</h2>

    <form method="get">
        <input
            type="text"
            name="q"
            placeholder="مثلاً: فرق JWT و Session چیه؟"
            value="{{ question|default:'' }}"
            required
        >
    </form>
    {% if error %}
    <pre style="color:red">{{ error }}</pre>
{% endif %}
</div>
{% if response %}
    <pre>{{ response.choices.0.message.content }}</pre>
{% endif %}
