<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تمرین‌های اختصاصی برای دانش‌آموزان</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .student-header {
            margin-bottom: 20px;
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
        }
        .exercise-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 0 4px rgba(0,0,0,0.08);
        }
        .exercise-title {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .exercise-type {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="student-header">
        <h1>تمرین‌های اختصاصی برای دانش‌آموزان</h1>
    </div>

    {% for student in students_exercises %}
        <div class="student-header">
            <h2>{{ student.name }}</h2>
            <h3>تمرین‌های اختصاصی:</h3>
            <ul>
                {% for exercise in student.exercises %}
                    <li>{{ exercise }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</div>
</body>
</html>
